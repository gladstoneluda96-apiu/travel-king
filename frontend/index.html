<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#0a0f14">
  <script>
    // 首屏绘制前应用主题，避免暗色用户看到白闪
    (function () {
      try {
        var saved = window.localStorage.getItem('tripstar.theme')
        var mode =
          saved === 'light' || saved === 'dark'
            ? saved
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        document.documentElement.dataset.theme = mode
        document.documentElement.style.colorScheme = mode
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', mode === 'dark' ? '#0a0f14' : '#f5f6f7')
      } catch (error) {
        /* 忽略读取失败 */
      }
    })()
  </script>
  <title>TripStar</title>
</head>

<body>
  <div id="app"></div>
  <script type="text/javascript">
    // 高德 JS API 2.0 的安全密钥。构建时由 VITE_AMAP_SECURITY_JS_CODE 注入。
    // 这里使用非 Vite %ENV% 格式占位符，避免变量未配置时触发 Vite warning。
    window._AMapSecurityConfig = {
      securityJsCode: '__AMAP_SECURITY_JS_CODE__'
    }
  </script>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
